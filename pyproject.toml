[project]
name = "pyro"
version = "0.1.0"
description = "pyroCb vs matched-fire comparison of AeroCom / ECHAM-HAM PPE output against satellite observations (boreal pilot)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
]

[project.optional-dependencies]
# Model extraction, satellite download and collocation (step 1).
analysis = [
    "xarray>=2024.6",
    "netcdf4>=1.7",
    "h5netcdf>=1.3",
    "dask[array]>=2024.6",
    "scipy>=1.13",
    "pyproj>=3.6",
    "shapely>=2.0",
    "earthaccess>=0.11",
    "cdsapi>=0.7",
    "s3fs>=2024.6",
    "matplotlib>=3.8",
]
# Versioned data exchange with collaborators (`dvc pull`).
dvc = [
    "dvc[s3,webdav,ssh]>=3.50",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
pyro-sync = "pyro.sync:main"
pyro-events = "pyro.events:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyro"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
